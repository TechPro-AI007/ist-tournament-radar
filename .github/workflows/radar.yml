name: IST Tournament Radar

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual 1-click test runs

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tournament Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper.py

      - name: Commit updated seen_tournaments.json
        run: |
          git config user.name "IST Radar Bot"
          git config user.email "actions@github.com"
          git add seen_tournaments.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update seen tournaments"
          git push